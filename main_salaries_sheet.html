<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>شيت مرتبات شركة نور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fcfdfe; color: #1e293b; }
        .header-strip {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1.2fr 1.2fr;
            background: #2563eb;
            border-radius: 50px;
            color: white;
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }
        .header-strip div { padding: 15px 5px; text-align: center; }
        .data-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1.2fr 1.2fr;
            background: white;
            margin-bottom: 6px;
            border-radius: 20px;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .data-row div { padding: 10px 5px; text-align: center; font-size: 12px; font-weight: bold; }
        .edit-input { width: 60px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; padding: 2px; }
        .cycle-select { background: transparent; border: none; font-size: 10px; font-weight: bold; color: #2563eb; cursor: pointer; }
        .dashboard-card { border-radius: 2.5rem; padding: 1.5rem; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 280px; }
        .card-blue { background: #1e3a8a; color: white; }
        .card-red { border: 2px solid #ef4444; color: #ef4444; background: white; }
        .card-white { border: 2px solid #3b82f6; color: #1e40af; background: white; }
    </style>
</head>
<body class="p-6 italic">

    <header class="max-w-[1400px] mx-auto flex justify-between items-center mb-6 no-print">
        <div class="flex items-center gap-4">
            <div class="bg-blue-100 p-3 rounded-2xl">
                <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" width="40" alt="Finance Icon">
            </div>
            <div class="text-right">
                <h1 class="text-2xl font-black text-blue-900">شيت مرتبات شركة نور</h1>
                <p class="text-[11px] text-blue-500 font-bold uppercase tracking-widest">المبرمجة: مروة سمير</p>
            </div>
        </div>

        <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-blue-50 items-center">
            <span class="text-[10px] font-black mr-2">الفترة من:</span>
            <input type="date" id="start" class="text-xs font-bold bg-slate-50 p-2 rounded-lg outline-none">
            <input type="date" id="end" class="text-xs font-bold bg-slate-50 p-2 rounded-lg outline-none">
            <button onclick="calculate()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black hover:bg-blue-700 transition-all">تحديث الحسابات</button>
        </div>

        <div class="flex gap-2">
            <button onclick="downloadPDF()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black flex items-center gap-2">حفظ PDF</button>
            <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black flex items-center gap-2">طباعة</button>
        </div>
    </header>

    <div id="pdfContent" class="max-w-[1400px] mx-auto">
        <div class="header-strip">
            <div class="rounded-r-full">الموظف</div>
            <div>دورة القبض</div>
            <div>الراتب الأساسي</div>
            <div>الراتب المستحق</div>
            <div>اليومية</div>
            <div>أيام الغياب</div>
            <div class="bg-blue-700">سعر الغياب</div>
            <div class="bg-blue-800">التأمينات</div>
            <div class="bg-blue-500">سلفة (يدوي)</div>
            <div class="bg-blue-900">جزاءات</div>
            <div class="bg-slate-900 text-emerald-400">الصافي النهائي</div>
            <div class="bg-slate-800 rounded-l-full">إجمالي السلفيات</div>
        </div>

        <div id="data-container">
            </div>

        <div class="flex flex-wrap justify-center gap-6 mt-10">
            <div class="dashboard-card card-white">
                <h3 class="text-sm font-black mb-1">إجمالي المستحقات</h3>
                <p class="text-3xl font-black"><span id="total-earnings">0</span> ج.م</p>
            </div>
            <div class="dashboard-card card-red">
                <h3 class="text-sm font-black mb-1">إجمالي الخصومات</h3>
                <p class="text-3xl font-black"><span id="total-deductions-all">0</span> ج.م</p>
            </div>
            <div class="dashboard-card card-blue">
                <h3 class="text-sm font-black mb-1">صافي المنصرف العام</h3>
                <p class="text-3xl font-black"><span id="total-net">0</span> ج.م</p>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const employees = JSON.parse(localStorage.getItem('nour_employees')) || [];
            const logs = JSON.parse(localStorage.getItem('attendance_logs')) || [];
            const startInput = document.getElementById('start').value;
            const endInput = document.getElementById('end').value;

            if(!startInput || !endInput) return;

            const start = new Date(startInput);
            const end = new Date(endInput);

            let html = '';
            let gEarnings = 0, gDeductions = 0, gNet = 0;

            employees.forEach((emp, index) => {
                const daily = parseFloat(emp.dailyRate) || 0;
                
                // حساب الحضور الفعلي
                const empLogs = logs.filter(l => {
                    const d = new Date(l.date);
                    return l.name === emp.name && l.type === 'حضور' && d >= start && d <= end;
                });

                let earned = empLogs.length * daily;
                let insurance = parseFloat(emp.insurance) || 0;
                let penalties = parseFloat(emp.penalties) || 0;
                let totalLoansHistory = parseFloat(emp.totalLoans) || 0; // السلف الكلي من الداش بورد
                
                let net = earned - (insurance + penalties);

                html += `
                <div class="data-row shadow-sm">
                    <div class="text-blue-900 font-black">${emp.name}</div>
                    <div>
                        <select class="cycle-select">
                            <option>أسبوعي</option>
                            <option>أسبوعين</option>
                            <option>شهري</option>
                        </select>
                    </div>
                    <div class="text-slate-400">${emp.baseSalary || 0}</div>
                    <div class="text-blue-600 font-black">${earned}</div>
                    <div class="text-slate-600">${daily}</div>
                    <div class="text-red-500">${emp.absentDays || 0}</div>
                    <div class="text-red-400 font-bold">${(emp.absentDays || 0) * daily}</div>
                    <div class="text-slate-500">${insurance}</div>
                    <div><input type="number" class="edit-input" value="0" oninput="updateRowNet(this, ${earned}, ${insurance}, ${penalties})"></div>
                    <div class="text-red-600">${penalties}</div>
                    <div class="bg-blue-50 text-blue-900 font-black row-net">${net} ج.م</div>
                    <div class="text-slate-700 font-black">${totalLoansHistory}</div>
